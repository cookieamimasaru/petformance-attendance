<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Camera Test</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>

<h2>Petformance QR Test</h2>

<div id="reader" style="width:320px;"></div>

<h3 id="result">Waiting for QR...</h3>

<script>

function qrFound(decodedText) {

  document.getElementById("result").innerHTML =
    "QR FOUND:<br>" + decodedText;

  let employeeCode = decodedText;

  // Get employee code from QR URL
  if (decodedText.includes("?code=")) {
    employeeCode = decodedText.split("?code=")[1];
  }

  // Remove anything after &
  if (employeeCode.includes("&")) {
    employeeCode = employeeCode.split("&")[0];
  }

  document.getElementById("result").innerHTML =
    "Sending code:<br>" + employeeCode;

  fetch(
    "https://script.google.com/macros/s/AKfycbxk-aX6MmYty1x19roVee3vRf5v7YQWdpSH4CJjI7dtZ5_UMpcrMW5HuhEtJhSqe8gx/exec?code="
    + encodeURIComponent(employeeCode)
  )

  .then(response => response.text())

  .then(result => {

    document.getElementById("result").innerHTML =
      "Employee Code: " + employeeCode +
      "<br><br>Server:<br>" + result;

  })

  .catch(error => {

    document.getElementById("result").innerHTML =
      "FETCH ERROR:<br>" + error;

  });

}

const scanner = new Html5Qrcode("reader");

Html5Qrcode.getCameras()

.then(function(cameras) {

  if (cameras.length === 0) {

    document.getElementById("result").innerHTML =
      "NO CAMERA FOUND";

    return;
  }

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: 250
    },
    qrFound
  );

})

.catch(function(error) {

  document.getElementById("result").innerHTML =
    "CAMERA ERROR:<br>" + error;

});

</script>

</body>
</html>

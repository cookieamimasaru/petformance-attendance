<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Petformance Attendance Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h2 {
  color: #1565c0;
  margin-bottom: 5px;
}

h3 {
  margin-top: 5px;
  color: #555;
}

#reader {
  width: 320px;
  margin: 20px auto;
}

#result {
  margin: 20px auto;
  max-width: 450px;
  padding: 20px;
  font-size: 20px;
  font-weight: bold;
  background: white;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  min-height: 70px;
}

.name {
  font-size: 24px;
  margin-bottom: 10px;
}

.success {
  color: #188038;
}

.wait {
  color: #d93025;
}

.ready {
  color: #1565c0;
}

.employee-photo {
  width: 140px;
  height: 140px;
  object-fit: cover;
  border-radius: 50%;
  margin: 10px auto 20px auto;
  display: block;
}

.photo-loading {
  color: #777;
  font-size: 14px;
  font-weight: normal;
}

</style>

</head>


<body>

<h2>Petformance Veterinary</h2>

<h3>Attendance Scanner</h3>

<div id="reader"></div>

<div id="result" class="ready">
  Ready to scan
</div>


<script>

let scanLock = false;


// ============================================================
// APPS SCRIPT URL
// ============================================================

const appsScriptUrl =
  "https://script.google.com/macros/s/AKfycbxk-aX6MmYty1x19roVee3vRf5v7YQWdpSH4CJjI7dtZ5_UMpcrMW5HuhEtJhSqe8gx/exec";


// ============================================================
// AUTHORIZED DEVICE ID
// ============================================================

// This must match the Device ID in:
// Attendance Devices → TEST-DEVICE-001

const attendanceDeviceId =
  "TEST-DEVICE-001";


// ============================================================
// DEVICE NAME
// ============================================================

const attendanceDeviceName =
  "Clinic Attendance Phone";


// ============================================================
// QR SCAN
// ============================================================

function onScanSuccess(decodedText) {

  if (scanLock) {
    return;
  }

  scanLock = true;


  const result =
    document.getElementById("result");


  result.className =
    "ready";


  result.innerHTML =
    "Reading QR...";


  // ==========================================================
  // GET EMPLOYEE CODE
  // ==========================================================

  let employeeCode = "";


  try {

    const qrUrl =
      new URL(decodedText);

    employeeCode =
      qrUrl.searchParams.get("code");

  }

  catch (error) {

    employeeCode =
      decodedText.trim();

  }


  if (!employeeCode) {

    result.className =
      "wait";

    result.innerHTML =
      "❌<br>No employee code found";

    unlockScanner(5000);

    return;
  }


  // ==========================================================
  // SEND ATTENDANCE
  // ==========================================================

  result.className =
    "ready";

  result.innerHTML =
    "Checking employee...";


  // ==========================================================
  // BUILD REQUEST
  // ==========================================================

  const requestUrl =
    appsScriptUrl +
    "?attendance=1" +
    "&code=" +
    encodeURIComponent(employeeCode) +
    "&deviceId=" +
    encodeURIComponent(attendanceDeviceId) +
    "&deviceName=" +
    encodeURIComponent(attendanceDeviceName);


  console.log(
    "Sending attendance request:"
  );

  console.log(
    "Employee:",
    employeeCode
  );

  console.log(
    "Device:",
    attendanceDeviceId
  );


  // ==========================================================
  // SEND TO APPS SCRIPT
  // ==========================================================

  fetch(
    requestUrl,
    {
      method: "GET",
      cache: "no-store"
    }
  )

  .then(function(response) {

    console.log(
      "Apps Script HTTP status:",
      response.status
    );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    return response.text();

  })


  .then(function(responseText) {

    console.log(
      "Apps Script response length:",
      responseText.length
    );


    console.log(
      "Apps Script response:",
      responseText
    );


    showResult(
      responseText
    );

  })


  .catch(function(error) {

    console.error(
      "Attendance request error:",
      error
    );


    result.className =
      "wait";


    result.innerHTML =
      "❌<br>Connection error<br><small>" +
      escapeHtml(error.message) +
      "</small>";


    unlockScanner(5000);

  });

}


// ============================================================
// SHOW RESULT
// ============================================================

function showResult(
  responseText
) {

  const result =
    document.getElementById(
      "result"
    );


  let message =
    String(
      responseText || ""
    ).trim();


  // ==========================================================
  // REMOVE POSSIBLE GOOGLE WRAPPER
  // ==========================================================

  if (
    message.startsWith("<html") ||
    message.startsWith("<!DOCTYPE")
  ) {

    console.error(
      "Unexpected HTML response:",
      message.substring(
        0,
        500
      )
    );


    result.className =
      "wait";


    result.innerHTML =
      "❌<br>Apps Script returned an invalid response.";


    unlockScanner(5000);

    return;
  }


  // ==========================================================
  // PARSE JSON
  // ==========================================================

  let data = null;


  try {

    data =
      JSON.parse(
        message
      );

  }

  catch (error) {

    console.log(
      "Response is not JSON."
    );


    // --------------------------------------------------------
    // DEVICE NOT AUTHORIZED
    // --------------------------------------------------------

    if (
      message ===
      "Unauthorized attendance device"
    ) {

      result.className =
        "wait";


      result.innerHTML =
        "🔒<br>Attendance device not authorized";


      unlockScanner(5000);

      return;
    }


    // --------------------------------------------------------
    // WAIT MESSAGE
    // --------------------------------------------------------

    if (
      message.startsWith(
        "Please wait"
      )
    ) {

      result.className =
        "wait";


      result.innerHTML =
        "⏳<br>" +
        escapeHtml(
          message
        );


      unlockScanner(3000);

      return;
    }


    // --------------------------------------------------------
    // ALREADY COMPLETED
    // --------------------------------------------------------

    if (
      message ===
      "Attendance already completed"
    ) {

      result.className =
        "wait";


      result.innerHTML =
        "ℹ️<br>Attendance already completed";


      unlockScanner(5000);

      return;
    }


    // --------------------------------------------------------
    // EMPLOYEE NOT FOUND
    // --------------------------------------------------------

    if (
      message ===
      "Employee not found"
    ) {

      result.className =
        "wait";


      result.innerHTML =
        "❌<br>Employee not found";


      unlockScanner(5000);

      return;
    }


    // --------------------------------------------------------
    // OTHER MESSAGE
    // --------------------------------------------------------

    result.className =
      "wait";


    result.innerHTML =
      escapeHtml(
        message
      );


    unlockScanner(5000);

    return;
  }


  // ==========================================================
  // TIME IN
  // ==========================================================

  if (
    data.type ===
    "TIME_IN"
  ) {

    showTimeIn(
      data
    );

    return;
  }


  // ==========================================================
  // TIME OUT
  // ==========================================================

  if (
    data.type ===
    "TIME_OUT"
  ) {

    showTimeOut(
      data
    );

    return;
  }


  // ==========================================================
  // UNKNOWN RESPONSE
  // ==========================================================

  result.className =
    "wait";


  result.innerHTML =
    "❌<br>Unknown attendance response";


  unlockScanner(5000);

}


// ============================================================
// SHOW TIME IN
// ============================================================

function showTimeIn(
  data
) {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "success";


  result.innerHTML =

    "✅<br>" +

    "<div class='name'>" +
    "TIME IN" +
    "</div>" +

    "<strong>" +
    escapeHtml(
      data.name
    ) +
    "</strong><br>" +

    escapeHtml(
      data.employeeID
    ) +
    "<br>" +

    escapeHtml(
      data.position
    ) +
    "<br><br>" +

    "<strong>" +
    escapeHtml(
      data.time
    ) +
    "</strong><br><br>" +

    escapeHtml(
      data.message
    );


  // ==========================================================
  // PHOTO
  // ==========================================================

  loadEmployeePhoto(
    data.photo
  );


  unlockScanner(8000);

}


// ============================================================
// SHOW TIME OUT
// ============================================================

function showTimeOut(
  data
) {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "success";


  result.innerHTML =

    "✅<br>" +

    "<div class='name'>" +
    "TIME OUT" +
    "</div>" +

    "<strong>" +
    escapeHtml(
      data.name
    ) +
    "</strong><br>" +

    escapeHtml(
      data.employeeID
    ) +
    "<br>" +

    escapeHtml(
      data.position
    ) +
    "<br><br>" +

    "<strong>" +
    escapeHtml(
      data.time
    ) +
    "</strong><br>" +

    "Total Hours: " +
    escapeHtml(
      data.totalHours
    ) +

    "<br><br>" +

    escapeHtml(
      data.message
    );


  // ==========================================================
  // PHOTO
  // ==========================================================

  loadEmployeePhoto(
    data.photo
  );


  unlockScanner(8000);

}


// ============================================================
// LOAD EMPLOYEE PHOTO
// ============================================================

function loadEmployeePhoto(
  photoUrl
) {

  if (
    !photoUrl ||
    String(photoUrl).trim() === ""
  ) {

    return;
  }


  const result =
    document.getElementById(
      "result"
    );


  const loading =
    document.createElement(
      "div"
    );


  loading.className =
    "photo-loading";


  loading.innerHTML =
    "Loading photo...";


  result.appendChild(
    loading
  );


  const img =
    document.createElement(
      "img"
    );


  img.className =
    "employee-photo";


  img.alt =
    "Employee Photo";


  img.onload =
    function() {

      loading.remove();


      result.insertBefore(
        img,
        result.firstChild
      );

    };


  img.onerror =
    function() {

      console.warn(
        "Employee photo could not be loaded."
      );


      loading.remove();

    };


  // ==========================================================
  // GOOGLE DRIVE PHOTO
  // ==========================================================

  let url =
    String(
      photoUrl
    ).trim();


  if (
    url.indexOf(
      "lh3.googleusercontent.com/d/"
    ) !== -1
  ) {

    const match =
      url.match(
        /\/d\/([^/?]+)/
      );


    if (match) {

      const fileId =
        match[1];


      url =
        "https://lh3.googleusercontent.com/d/" +
        fileId;

    }

  }


  img.src =
    url;

}


// ============================================================
// UNLOCK SCANNER
// ============================================================

function unlockScanner(
  delay
) {

  setTimeout(
    function() {

      scanLock =
        false;


      const result =
        document.getElementById(
          "result"
        );


      result.className =
        "ready";


      result.innerHTML =
        "Ready for next scan";

    },
    delay
  );

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";
  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ============================================================
// START CAMERA
// ============================================================

const html5QrCode =
  new Html5Qrcode(
    "reader"
  );


Html5Qrcode
  .getCameras()

  .then(
    function(devices) {

      if (
        devices &&
        devices.length
      ) {

        html5QrCode.start(

          {
            facingMode:
              "environment"
          },

          {
            fps: 10,
            qrbox: 250
          },

          onScanSuccess

        );

      }

      else {

        document.getElementById(
          "result"
        ).className =
          "wait";


        document.getElementById(
          "result"
        ).innerHTML =
          "No camera found.";

      }

    }
  )

  .catch(
    function(error) {

      console.error(
        "Camera error:",
        error
      );


      document.getElementById(
        "result"
      ).className =
        "wait";


      document.getElementById(
        "result"
      ).innerHTML =
        "Camera Error";

    }
  );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Petformance Attendance Terminal</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 12px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #fffaf5 0%,
          #fff3e6 50%,
          #fffaf5 100%
        );

      color: #333;
    }


    /* =========================
       MAIN TERMINAL
       ========================= */

    .terminal {

      width: 100%;
      max-width: 620px;

      margin: 0 auto;

      padding: 28px 22px 24px;

      background: #ffffff;

      border-radius: 26px;

      box-shadow:
        0 15px 45px
        rgba(0, 0, 0, 0.10);

      border:
        1px solid #f3e5d8;

    }


    /* =========================
       LOGO
       ========================= */

    .logo-container {
  text-align: center;
  margin-bottom: 0;
  height: 145px;
  overflow: hidden;
}

.logo {
  width: 270px;
  max-width: 85%;
  height: 145px;
  display: block;
  margin: -5px auto 0;
  object-fit: cover;
  object-position: center;
}

    /* =========================
       TERMINAL TITLE
       ========================= */

   .terminal-title {
  margin-top: 0;
  color: #555;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: center;
}


    .title-line {

      width: 65px;

      height: 4px;

      background: #f58220;

      border-radius: 10px;

      margin: 8px auto 18px;

    }


    /* =========================
       DEVICE STATUS
       ========================= */

    .device-status {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding: 8px 16px;

      border-radius: 30px;

      background: #e8f5e9;

      color: #188038;

      font-size: 14px;

      font-weight: bold;

    }


    .status-wrapper {

      text-align: center;

    }


    .status-dot {

      width: 9px;

      height: 9px;

      border-radius: 50%;

      background: #188038;

      box-shadow:
        0 0 0 4px
        rgba(24,128,56,0.10);

    }


    .device-name {

      margin: 7px 0 20px;

      text-align: center;

      color: #8a8a8a;

      font-size: 13px;

    }


    /* =========================
       READY BOX
       ========================= */

    .ready-box {

      margin-bottom: 18px;

      padding: 18px 15px;

      background:
        linear-gradient(
          135deg,
          #fffaf5,
          #fff3e6
        );

      border:
        2px solid #f9dfc7;

      border-radius: 18px;

      text-align: center;

    }


    .ready-icon {

      font-size: 30px;

      margin-bottom: 5px;

    }


    .ready-title {

      color: #f58220;

      font-size: 23px;

      font-weight: 900;

      letter-spacing: 1px;

    }


    .ready-subtitle {

      margin-top: 5px;

      color: #888;

      font-size: 14px;

    }


    /* =========================
       QR CAMERA
       ========================= */

    #reader {

      width: 100%;

      max-width: 400px;

      margin: 0 auto 18px;

      overflow: hidden;

      border-radius: 20px;

      background: #111;

      border:
        4px solid #f58220;

      box-shadow:
        0 6px 20px
        rgba(0,0,0,0.12);

    }


    #reader video {

      width: 100% !important;

      border-radius: 15px !important;

    }


    #reader__scan_region {

      border-radius: 15px !important;

    }


    #reader img {

      max-width: 100%;

    }


    /* =========================
       RESULT CARD
       ========================= */

    #result {

      width: 100%;

      max-width: 520px;

      min-height: 78px;

      margin: 15px auto 0;

      padding: 20px;

      background: #ffffff;

      border-radius: 18px;

      border:
        2px solid #eeeeee;

      box-shadow:
        0 5px 18px
        rgba(0,0,0,0.06);

      font-size: 18px;

      font-weight: bold;

      text-align: center;

      transition:
        all 0.25s ease;

    }


    .ready {

      color: #f58220;

      border-color:
        #f9dfc7 !important;

      background:
        #fffaf5 !important;

    }


    .success {

      color: #188038;

      border-color:
        #d9f0df !important;

      background:
        #fbfffc !important;

    }


    .wait {

      color: #c62828;

      border-color:
        #f5d6d6 !important;

      background:
        #fffafa !important;

    }


    /* =========================
       EMPLOYEE PHOTO
       ========================= */

    .employee-photo {

      width: 145px;

      height: 145px;

      object-fit: cover;

      display: block;

      margin: 0 auto 15px;

      border-radius: 50%;

      border:
        5px solid #ffffff;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.15);

    }


    .photo-loading {

      margin-top: 10px;

      color: #999;

      font-size: 13px;

      font-weight: normal;

    }


    /* =========================
       ATTENDANCE RESULT
       ========================= */

    .attendance-type {

      margin-bottom: 12px;

      color: #188038;

      font-size: 22px;

      font-weight: 900;

      letter-spacing: 1px;

    }


    .name {

      margin: 10px 0;

      color: #333;

      font-size: 26px;

      line-height: 1.25;

      font-weight: 800;

    }


    .employee-info {

      color: #666;

      font-size: 16px;

      line-height: 1.6;

      font-weight: normal;

    }


    .attendance-time {

      display: inline-block;

      margin-top: 15px;

      padding: 10px 20px;

      background: #e8f5e9;

      color: #188038;

      border-radius: 12px;

      font-size: 25px;

      font-weight: 900;

    }


    .total-hours {

      margin-top: 10px;

      color: #666;

      font-size: 16px;

      font-weight: normal;

    }


    /* =========================
       FOOTER
       ========================= */

    .footer {

      margin-top: 22px;

      padding-top: 15px;

      border-top:
        1px solid #eeeeee;

      color: #999;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;

    }


    .footer strong {

      color: #f58220;

      font-weight: 700;

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {

      body {

        padding:
          10px 7px;

      }


      .terminal {

        padding:
          22px 13px 20px;

        border-radius:
          20px;

      }


      .logo {

        width: 240px;

      }


      .terminal-title {

        font-size: 14px;

        letter-spacing: 1.5px;

      }


      .ready-title {

        font-size: 20px;

      }


      #reader {

        max-width: 340px;

      }


      .name {

        font-size: 23px;

      }


      .attendance-time {

        font-size: 22px;

      }

    }

  </style>

</head>


<body>


  <div class="terminal">


    <!-- =========================
         PETFORMANCE LOGO
         ========================= -->

    <div class="logo-container">

      <img
        src="petformance-logo.png"
        class="logo"
        alt="Petformance Veterinary"
      >

    </div>


    <div class="terminal-title">

      Attendance Terminal

    </div>


    <div class="title-line"></div>


    <!-- =========================
         DEVICE STATUS
         ========================= -->

    <div class="status-wrapper">

      <div class="device-status">

        <span class="status-dot"></span>

        Device Authorized

      </div>

    </div>


    <div class="device-name">

      Clinic Attendance Phone

    </div>


    <!-- =========================
         READY BOX
         ========================= -->

    <div class="ready-box">

      <div class="ready-icon">
        📷
      </div>

      <div class="ready-title">
        READY TO SCAN
      </div>

      <div class="ready-subtitle">
        Scan your employee QR code
      </div>

    </div>


    <!-- =========================
         QR SCANNER
         ========================= -->

    <div id="reader"></div>


    <!-- =========================
         RESULT
         ========================= -->

    <div
      id="result"
      class="ready"
    >

      Ready for next scan

    </div>


    <!-- =========================
         FOOTER
         ========================= -->

    <div class="footer">

      <strong>
        Petformance Veterinary Animal Health and Wellness Clinic
      </strong>

      <br>

      Attendance System

    </div>


  </div>


<script>


/* ============================================================
   SCANNER LOCK
   ============================================================ */

let scanLock = false;


/* ============================================================
   APPS SCRIPT URL
   ============================================================ */

const appsScriptUrl =
  "https://script.google.com/macros/s/AKfycbxk-aX6MmYty1x19roVee3vRf5v7YQWdpSH4CJjI7dtZ5_UMpcrMW5HuhEtJhSqe8gx/exec";


/* ============================================================
   AUTHORIZED DEVICE ID
   ============================================================ */

const attendanceDeviceId =
  "TEST-DEVICE-001";


/* ============================================================
   DEVICE NAME
   ============================================================ */

const attendanceDeviceName =
  "Clinic Attendance Phone";


/* ============================================================
   QR SCAN
   ============================================================ */

function onScanSuccess(decodedText) {


  if (scanLock) {

    return;

  }


  scanLock = true;


  const result =
    document.getElementById("result");


  result.className =
    "ready";


  result.innerHTML =
    "Reading QR...";


  /* ==========================================================
     GET EMPLOYEE CODE
     ========================================================== */

  let employeeCode = "";


  try {

    const qrUrl =
      new URL(decodedText);


    employeeCode =
      qrUrl.searchParams.get("code");

  }


  catch (error) {

    employeeCode =
      decodedText.trim();

  }


  /* ==========================================================
     CHECK EMPLOYEE CODE
     ========================================================== */

  if (!employeeCode) {

    result.className =
      "wait";


    result.innerHTML =
      "❌<br>No employee code found";


    unlockScanner(5000);

    return;

  }


  /* ==========================================================
     CHECKING EMPLOYEE
     ========================================================== */

  result.className =
    "ready";


  result.innerHTML =
    "Checking employee...";


  /* ==========================================================
     BUILD REQUEST
     ========================================================== */

  const requestUrl =

    appsScriptUrl +

    "?attendance=1" +

    "&code=" +

    encodeURIComponent(
      employeeCode
    ) +

    "&deviceId=" +

    encodeURIComponent(
      attendanceDeviceId
    ) +

    "&deviceName=" +

    encodeURIComponent(
      attendanceDeviceName
    );


  /* ==========================================================
     SEND TO APPS SCRIPT
     ========================================================== */

  fetch(

    requestUrl,

    {

      method: "GET",

      cache: "no-store"

    }

  )


  .then(

    function(response) {


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      return response.text();

    }

  )


  .then(

    function(responseText) {

      showResult(
        responseText
      );

    }

  )


  .catch(

    function(error) {


      console.error(
        "Attendance request error:",
        error
      );


      result.className =
        "wait";


      result.innerHTML =

        "❌<br>" +
        "Connection error";


      unlockScanner(5000);

    }

  );

}


/* ============================================================
   SHOW RESULT
   ============================================================ */

function showResult(responseText) {


  const result =
    document.getElementById("result");


  let message =
    String(
      responseText || ""
    ).trim();


  /* ==========================================================
     CHECK INVALID HTML RESPONSE
     ========================================================== */

  if (

    message.startsWith("<html") ||

    message.startsWith("<!DOCTYPE")

  ) {


    result.className =
      "wait";


    result.innerHTML =
      "❌<br>Apps Script returned an invalid response.";


    unlockScanner(5000);

    return;

  }


  /* ==========================================================
     PARSE JSON
     ========================================================== */

  let data = null;


  try {

    data =
      JSON.parse(message);

  }


  catch (error) {


    /* ========================================================
       DEVICE NOT AUTHORIZED
       ======================================================== */

    if (

      message ===
      "Unauthorized attendance device"

    ) {


      result.className =
        "wait";


      result.innerHTML =
        "🔒<br>Attendance device not authorized";


      unlockScanner(5000);

      return;

    }


    /* ========================================================
       WAIT MESSAGE
       ======================================================== */

    if (

      message.startsWith(
        "Please wait"
      )

    ) {


      result.className =
        "wait";


      result.innerHTML =

        "⏳<br>" +

        escapeHtml(
          message
        );


      unlockScanner(3000);

      return;

    }


    /* ========================================================
       ALREADY COMPLETED
       ======================================================== */

    if (

      message ===
      "Attendance already completed"

    ) {


      result.className =
        "wait";


      result.innerHTML =
        "ℹ️<br>Attendance already completed";


      unlockScanner(5000);

      return;

    }


    /* ========================================================
       EMPLOYEE NOT FOUND
       ======================================================== */

    if (

      message ===
      "Employee not found"

    ) {


      result.className =
        "wait";


      result.innerHTML =
        "❌<br>Employee not found";


      unlockScanner(5000);

      return;

    }


    /* ========================================================
       OTHER MESSAGE
       ======================================================== */

    result.className =
      "wait";


    result.innerHTML =
      escapeHtml(message);


    unlockScanner(5000);

    return;

  }


  /* ==========================================================
     TIME IN
     ========================================================== */

  if (

    data.type ===
    "TIME_IN"

  ) {

    showTimeIn(data);

    return;

  }


  /* ==========================================================
     TIME OUT
     ========================================================== */

  if (

    data.type ===
    "TIME_OUT"

  ) {

    showTimeOut(data);

    return;

  }


  /* ==========================================================
     UNKNOWN RESPONSE
     ========================================================== */

  result.className =
    "wait";


  result.innerHTML =
    "❌<br>Unknown attendance response";


  unlockScanner(5000);

}


/* ============================================================
   TIME IN
   ============================================================ */

function showTimeIn(data) {


  const result =
    document.getElementById("result");


  result.className =
    "success";


  result.innerHTML =

    "<div class='attendance-type'>" +

    "✅ TIME IN" +

    "</div>" +


    "<div class='name'>" +

    escapeHtml(
      data.name
    ) +

    "</div>" +


    "<div class='employee-info'>" +

    escapeHtml(
      data.employeeID
    ) +

    "<br>" +

    escapeHtml(
      data.position
    ) +

    "</div>" +


    "<div class='attendance-time'>" +

    escapeHtml(
      data.time
    ) +

    "</div>" +


    "<div class='employee-info' style='margin-top:15px;'>" +

    escapeHtml(
      data.message
    ) +

    "</div>";


  loadEmployeePhoto(
    data.photo
  );


  unlockScanner(8000);

}


/* ============================================================
   TIME OUT
   ============================================================ */

function showTimeOut(data) {


  const result =
    document.getElementById("result");


  result.className =
    "success";


  result.innerHTML =

    "<div class='attendance-type'>" +

    "✅ TIME OUT" +

    "</div>" +


    "<div class='name'>" +

    escapeHtml(
      data.name
    ) +

    "</div>" +


    "<div class='employee-info'>" +

    escapeHtml(
      data.employeeID
    ) +

    "<br>" +

    escapeHtml(
      data.position
    ) +

    "</div>" +


    "<div class='attendance-time'>" +

    escapeHtml(
      data.time
    ) +

    "</div>" +


    "<div class='total-hours'>" +

    "Total Hours: " +

    escapeHtml(
      data.totalHours
    ) +

    "</div>" +


    "<div class='employee-info' style='margin-top:15px;'>" +

    escapeHtml(
      data.message
    ) +

    "</div>";


  loadEmployeePhoto(
    data.photo
  );


  unlockScanner(8000);

}


/* ============================================================
   EMPLOYEE PHOTO
   ============================================================ */

function loadEmployeePhoto(photoUrl) {


  if (

    !photoUrl ||

    String(photoUrl).trim() === ""

  ) {

    return;

  }


  const result =
    document.getElementById("result");


  const loading =
    document.createElement("div");


  loading.className =
    "photo-loading";


  loading.innerHTML =
    "Loading photo...";


  result.appendChild(
    loading
  );


  const img =
    document.createElement("img");


  img.className =
    "employee-photo";


  img.alt =
    "Employee Photo";


  img.onload =
    function() {


      loading.remove();


      result.insertBefore(
        img,
        result.firstChild
      );

    };


  img.onerror =
    function() {


      loading.remove();


      console.warn(
        "Employee photo could not be loaded."
      );

    };


  let url =
    String(
      photoUrl
    ).trim();


  /* ==========================================================
     GOOGLE DRIVE PHOTO
     ========================================================== */

  if (

    url.indexOf(
      "lh3.googleusercontent.com/d/"
    ) !== -1

  ) {


    const match =
      url.match(
        /\/d\/([^/?]+)/
      );


    if (match) {


      const fileId =
        match[1];


      url =
        "https://lh3.googleusercontent.com/d/" +
        fileId;

    }

  }


  img.src =
    url;

}


/* ============================================================
   UNLOCK SCANNER
   ============================================================ */

function unlockScanner(delay) {


  setTimeout(

    function() {


      scanLock =
        false;


      const result =
        document.getElementById("result");


      result.className =
        "ready";


      result.innerHTML =

        "<div style='font-size:30px;margin-bottom:5px;'>📷</div>" +

        "<strong>READY TO SCAN</strong>" +

        "<div style='font-size:13px;font-weight:normal;color:#888;margin-top:6px;'>" +

        "Scan your employee QR code" +

        "</div>";

    },

    delay

  );

}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value) {


  if (

    value === null ||

    value === undefined

  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ============================================================
   START CAMERA — BACK CAMERA
   ============================================================ */

const html5QrCode =
  new Html5Qrcode("reader");


Html5Qrcode.getCameras()


.then(

  function(devices) {


    if (

      !devices ||

      !devices.length

    ) {


      document.getElementById(
        "result"
      ).className = "wait";


      document.getElementById(
        "result"
      ).innerHTML =
        "❌<br>No camera found.";


      return;

    }


    console.log(
      "Available cameras:",
      devices
    );


    /* ========================================================
       FIND BACK CAMERA
       ======================================================== */

    let backCamera =
      devices.find(

        function(device) {


          const label =
            (
              device.label ||
              ""
            ).toLowerCase();


          return (

            label.includes("back") ||

            label.includes("rear") ||

            label.includes("environment")

          );

        }

      );


    /* ========================================================
       USE BACK CAMERA
       ======================================================== */

    if (backCamera) {


      console.log(
        "✅ Back camera selected:",
        backCamera.label
      );


      html5QrCode.start(

        backCamera.id,

        {

          fps: 10,

          qrbox: 250

        },

        onScanSuccess

      );

    }


    else {


      console.log(
        "⚠️ Back camera name unavailable."
      );


      console.log(
        "Using environment-facing camera."
      );


      html5QrCode.start(

        {

          facingMode: {
            ideal: "environment"
          }

        },

        {

          fps: 10,

          qrbox: 250

        },

        onScanSuccess

      );

    }

  }

)


.catch(

  function(error) {


    console.error(
      "Camera error:",
      error
    );


    document.getElementById(
      "result"
    ).className =
      "wait";


    document.getElementById(
      "result"
    ).innerHTML =
      "❌<br>Camera Error";

  }

);

</script>


</body>

</html>

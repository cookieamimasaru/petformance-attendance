<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Petformance Attendance Terminal</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          #f7fbff 0%,
          #eef5fb 100%
        );

      margin: 0;

      min-height: 100vh;

      padding: 25px 15px;

      color: #263238;
    }


    /* =====================================================
       TERMINAL
       ===================================================== */

    .terminal {

      width: 100%;

      max-width: 620px;

      margin: 0 auto;

      background: #ffffff;

      border-radius: 24px;

      padding: 28px 22px 30px;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.10);
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .logo {

      width: 76px;

      height: 76px;

      margin: 0 auto 10px;

      border-radius: 50%;

      background: #1565c0;

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 38px;

      box-shadow:
        0 5px 15px
        rgba(21, 101, 192, 0.25);
    }


    h1 {

      margin: 5px 0 2px;

      font-size: 28px;

      color: #1565c0;

      font-weight: 700;
    }


    .terminal-title {

      margin: 0;

      font-size: 16px;

      color: #607d8b;

      font-weight: 600;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }


    /* =====================================================
       DEVICE STATUS
       ===================================================== */

    .device-status {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin: 18px auto 5px;

      padding: 8px 15px;

      border-radius: 30px;

      background: #e8f5e9;

      color: #188038;

      font-size: 14px;

      font-weight: bold;
    }


    .status-dot {

      width: 9px;

      height: 9px;

      border-radius: 50%;

      background: #188038;

      box-shadow:
        0 0 0 4px
        rgba(24, 128, 56, 0.10);
    }


    .device-name {

      margin: 2px 0 20px;

      color: #78909c;

      font-size: 13px;
    }


    /* =====================================================
       READY MESSAGE
       ===================================================== */

    .ready-box {

      margin: 5px auto 20px;

      padding: 18px;

      background: #f5f9fd;

      border: 2px solid #e3edf7;

      border-radius: 18px;
    }


    .ready-icon {

      font-size: 34px;

      margin-bottom: 5px;
    }


    .ready-title {

      font-size: 22px;

      font-weight: 800;

      color: #1565c0;

      letter-spacing: 1px;
    }


    .ready-subtitle {

      margin-top: 5px;

      color: #78909c;

      font-size: 14px;

      font-weight: normal;
    }


    /* =====================================================
       QR READER
       ===================================================== */

    #reader {

      width: 100%;

      max-width: 380px;

      margin: 0 auto 20px;

      border-radius: 18px;

      overflow: hidden;

      background: #111;
    }


    #reader video {

      border-radius: 18px !important;
    }


    #reader__scan_region {

      border-radius: 18px !important;
    }


    /* =====================================================
       RESULT CARD
       ===================================================== */

    #result {

      margin: 20px auto 0;

      width: 100%;

      max-width: 500px;

      padding: 25px 20px;

      font-size: 18px;

      font-weight: bold;

      background: white;

      border-radius: 20px;

      border: 2px solid #edf2f6;

      box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.06);

      min-height: 80px;

      transition:
        all 0.25s ease;
    }


    .ready {

      color: #1565c0;
    }


    .success {

      color: #188038;

      border-color: #d9f0df !important;

      background: #fbfffc !important;
    }


    .wait {

      color: #c62828;

      border-color: #f5d6d6 !important;

      background: #fffafa !important;
    }


    /* =====================================================
       RESULT CONTENT
       ===================================================== */

    .name {

      font-size: 27px;

      line-height: 1.25;

      margin: 12px 0;

      color: #263238;
    }


    .attendance-type {

      font-size: 20px;

      font-weight: 800;

      letter-spacing: 1px;

      margin-bottom: 12px;
    }


    .employee-info {

      font-size: 16px;

      line-height: 1.6;

      color: #546e7a;

      font-weight: normal;
    }


    .attendance-time {

      display: inline-block;

      margin-top: 15px;

      padding: 10px 20px;

      border-radius: 12px;

      background: #e8f5e9;

      color: #188038;

      font-size: 25px;

      font-weight: 800;
    }


    .total-hours {

      margin-top: 10px;

      font-size: 16px;

      color: #546e7a;

      font-weight: normal;
    }


    /* =====================================================
       EMPLOYEE PHOTO
       ===================================================== */

    .employee-photo {

      width: 145px;

      height: 145px;

      object-fit: cover;

      border-radius: 50%;

      margin: 0 auto 15px;

      display: block;

      border: 5px solid #ffffff;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.15);
    }


    .photo-loading {

      color: #90a4ae;

      font-size: 13px;

      font-weight: normal;

      margin-top: 10px;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {

      margin-top: 20px;

      color: #90a4ae;

      font-size: 12px;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 480px) {

      body {
        padding: 12px 8px;
      }

      .terminal {
        padding: 22px 14px 25px;
        border-radius: 20px;
      }

      h1 {
        font-size: 24px;
      }

      #reader {
        max-width: 330px;
      }

      .name {
        font-size: 23px;
      }

      .attendance-time {
        font-size: 22px;
      }
    }

  </style>

</head>


<body>


<div class="terminal">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <div class="logo">
    🐾
  </div>


  <h1>
    Petformance Veterinary
  </h1>


  <div class="terminal-title">
    Attendance Terminal
  </div>


  <!-- =====================================================
       DEVICE STATUS
       ===================================================== -->

  <div class="device-status">

    <span class="status-dot"></span>

    Device Authorized

  </div>


  <div class="device-name">

    Clinic Attendance Phone

  </div>


  <!-- =====================================================
       READY BOX
       ===================================================== -->

  <div class="ready-box">

    <div class="ready-icon">
      📷
    </div>

    <div class="ready-title">
      READY TO SCAN
    </div>

    <div class="ready-subtitle">
      Scan your employee QR code
    </div>

  </div>


  <!-- =====================================================
       QR READER
       ===================================================== -->

  <div id="reader"></div>


  <!-- =====================================================
       RESULT
       ===================================================== -->

  <div
    id="result"
    class="ready"
  >

    Ready for next scan

  </div>


  <div class="footer">

    Petformance Veterinary
    •
    Attendance System

  </div>


</div>



<script>


let scanLock = false;


// ============================================================
// APPS SCRIPT URL
// ============================================================

const appsScriptUrl =
  "https://script.google.com/macros/s/AKfycbxk-aX6MmYty1x19roVee3vRf5v7YQWdpSH4CJjI7dtZ5_UMpcrMW5HuhEtJhSqe8gx/exec";


// ============================================================
// AUTHORIZED DEVICE ID
// ============================================================

const attendanceDeviceId =
  "TEST-DEVICE-001";


// ============================================================
// DEVICE NAME
// ============================================================

const attendanceDeviceName =
  "Clinic Attendance Phone";


// ============================================================
// QR SCAN
// ============================================================

function onScanSuccess(decodedText) {

  if (scanLock) {
    return;
  }


  scanLock = true;


  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "ready";


  result.innerHTML =
    "Reading QR...";


  // ==========================================================
  // GET EMPLOYEE CODE
  // ==========================================================

  let employeeCode = "";


  try {

    const qrUrl =
      new URL(decodedText);


    employeeCode =
      qrUrl.searchParams.get(
        "code"
      );

  }

  catch (error) {

    employeeCode =
      decodedText.trim();

  }


  if (!employeeCode) {

    result.className =
      "wait";


    result.innerHTML =
      "❌<br>No employee code found";


    unlockScanner(5000);


    return;
  }


  // ==========================================================
  // SEND ATTENDANCE
  // ==========================================================

  result.className =
    "ready";


  result.innerHTML =
    "Checking employee...";


  // ==========================================================
  // BUILD REQUEST
  // ==========================================================

  const requestUrl =

    appsScriptUrl +

    "?attendance=1" +

    "&code=" +

    encodeURIComponent(
      employeeCode
    ) +

    "&deviceId=" +

    encodeURIComponent(
      attendanceDeviceId
    ) +

    "&deviceName=" +

    encodeURIComponent(
      attendanceDeviceName
    );


  console.log(
    "Sending attendance request:"
  );


  console.log(
    "Employee:",
    employeeCode
  );


  console.log(
    "Device:",
    attendanceDeviceId
  );


  // ==========================================================
  // SEND TO APPS SCRIPT
  // ==========================================================

  fetch(
    requestUrl,
    {
      method: "GET",
      cache: "no-store"
    }
  )

  .then(
    function(response) {

      console.log(
        "Apps Script HTTP status:",
        response.status
      );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );
      }


      return response.text();

    }
  )


  .then(
    function(responseText) {

      console.log(
        "Apps Script response length:",
        responseText.length
      );


      console.log(
        "Apps Script response:",
        responseText
      );


      showResult(
        responseText
      );

    }
  )


  .catch(
    function(error) {

      console.error(
        "Attendance request error:",
        error
      );


      result.className =
        "wait";


      result.innerHTML =
        "❌<br>Connection error<br><small>" +
        escapeHtml(
          error.message
        ) +
        "</small>";


      unlockScanner(5000);

    }
  );

}


// ============================================================
// SHOW RESULT
// ============================================================

function showResult(
  responseText
) {


  const result =
    document.getElementById(
      "result"
    );


  let message =
    String(
      responseText || ""
    ).trim();


  // ==========================================================
  // REMOVE POSSIBLE GOOGLE WRAPPER
  // ==========================================================

  if (
    message.startsWith(
      "<html"
    ) ||
    message.startsWith(
      "<!DOCTYPE"
    )
  ) {

    console.error(
      "Unexpected HTML response:",
      message.substring(
        0,
        500
      )
    );


    result.className =
      "wait";


    result.innerHTML =
      "❌<br>Apps Script returned an invalid response.";


    unlockScanner(5000);


    return;
  }


  // ==========================================================
  // PARSE JSON
  // ==========================================================

  let data = null;


  try {

    data =
      JSON.parse(
        message
      );

  }

  catch (error) {

    console.log(
      "Response is not JSON."
    );


    // --------------------------------------------------------
    // DEVICE NOT AUTHORIZED
    // --------------------------------------------------------

    if (
      message ===
      "Unauthorized attendance device"
    ) {

      result.className =
        "wait";


      result.innerHTML =
        "🔒<br>Attendance device not authorized";


      unlockScanner(5000);


      return;
    }


    // --------------------------------------------------------
    // WAIT MESSAGE
    // --------------------------------------------------------

    if (
      message.startsWith(
        "Please wait"
      )
    ) {

      result.className =
        "wait";


      result.innerHTML =
        "⏳<br>" +
        escapeHtml(
          message
        );


      unlockScanner(3000);


      return;
    }


    // --------------------------------------------------------
    // ALREADY COMPLETED
    // --------------------------------------------------------

    if (
      message ===
      "Attendance already completed"
    ) {

      result.className =
        "wait";


      result.innerHTML =
        "ℹ️<br>Attendance already completed";


      unlockScanner(5000);


      return;
    }


    // --------------------------------------------------------
    // EMPLOYEE NOT FOUND
    // --------------------------------------------------------

    if (
      message ===
      "Employee not found"
    ) {

      result.className =
        "wait";


      result.innerHTML =
        "❌<br>Employee not found";


      unlockScanner(5000);


      return;
    }


    // --------------------------------------------------------
    // OTHER MESSAGE
    // --------------------------------------------------------

    result.className =
      "wait";


    result.innerHTML =
      escapeHtml(
        message
      );


    unlockScanner(5000);


    return;
  }


  // ==========================================================
  // TIME IN
  // ==========================================================

  if (
    data.type ===
    "TIME_IN"
  ) {

    showTimeIn(
      data
    );


    return;
  }


  // ==========================================================
  // TIME OUT
  // ==========================================================

  if (
    data.type ===
    "TIME_OUT"
  ) {

    showTimeOut(
      data
    );


    return;
  }


  // ==========================================================
  // UNKNOWN RESPONSE
  // ==========================================================

  result.className =
    "wait";


  result.innerHTML =
    "❌<br>Unknown attendance response";


  unlockScanner(5000);

}


// ============================================================
// SHOW TIME IN
// ============================================================

function showTimeIn(
  data
) {


  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "success";


  result.innerHTML =

    "<div class='attendance-type'>" +

    "✅ TIME IN" +

    "</div>" +

    "<div class='name'>" +

    escapeHtml(
      data.name
    ) +

    "</div>" +

    "<div class='employee-info'>" +

    escapeHtml(
      data.employeeID
    ) +

    "<br>" +

    escapeHtml(
      data.position
    ) +

    "</div>" +

    "<div class='attendance-time'>" +

    escapeHtml(
      data.time
    ) +

    "</div>" +

    "<div class='employee-info' style='margin-top:15px;'>" +

    escapeHtml(
      data.message
    ) +

    "</div>";


  loadEmployeePhoto(
    data.photo
  );


  unlockScanner(8000);

}


// ============================================================
// SHOW TIME OUT
// ============================================================

function showTimeOut(
  data
) {


  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "success";


  result.innerHTML =

    "<div class='attendance-type'>" +

    "✅ TIME OUT" +

    "</div>" +

    "<div class='name'>" +

    escapeHtml(
      data.name
    ) +

    "</div>" +

    "<div class='employee-info'>" +

    escapeHtml(
      data.employeeID
    ) +

    "<br>" +

    escapeHtml(
      data.position
    ) +

    "</div>" +

    "<div class='attendance-time'>" +

    escapeHtml(
      data.time
    ) +

    "</div>" +

    "<div class='total-hours'>" +

    "Total Hours: " +

    escapeHtml(
      data.totalHours
    ) +

    "</div>" +

    "<div class='employee-info' style='margin-top:15px;'>" +

    escapeHtml(
      data.message
    ) +

    "</div>";


  loadEmployeePhoto(
    data.photo
  );


  unlockScanner(8000);

}


// ============================================================
// LOAD EMPLOYEE PHOTO
// ============================================================

function loadEmployeePhoto(
  photoUrl
) {


  if (
    !photoUrl ||
    String(photoUrl).trim() === ""
  ) {

    return;
  }


  const result =
    document.getElementById(
      "result"
    );


  const loading =
    document.createElement(
      "div"
    );


  loading.className =
    "photo-loading";


  loading.innerHTML =
    "Loading photo...";


  result.appendChild(
    loading
  );


  const img =
    document.createElement(
      "img"
    );


  img.className =
    "employee-photo";


  img.alt =
    "Employee Photo";


  img.onload =
    function() {

      loading.remove();


      result.insertBefore(
        img,
        result.firstChild
      );

    };


  img.onerror =
    function() {

      console.warn(
        "Employee photo could not be loaded."
      );


      loading.remove();

    };


  // ==========================================================
  // GOOGLE DRIVE PHOTO
  // ==========================================================

  let url =
    String(
      photoUrl
    ).trim();


  if (
    url.indexOf(
      "lh3.googleusercontent.com/d/"
    ) !== -1
  ) {

    const match =
      url.match(
        /\/d\/([^/?]+)/
      );


    if (match) {

      const fileId =
        match[1];


      url =
        "https://lh3.googleusercontent.com/d/" +
        fileId;

    }

  }


  img.src =
    url;

}


// ============================================================
// UNLOCK SCANNER
// ============================================================

function unlockScanner(
  delay
) {


  setTimeout(
    function() {


      scanLock =
        false;


      const result =
        document.getElementById(
          "result"
        );


      result.className =
        "ready";


      result.innerHTML =

        "<div style='font-size:32px;margin-bottom:6px;'>📷</div>" +

        "<strong>READY TO SCAN</strong>" +

        "<div style='font-size:13px;font-weight:normal;color:#78909c;margin-top:6px;'>" +

        "Scan your employee QR code" +

        "</div>";


    },
    delay
  );

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(
  value
) {


  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ============================================================
// START CAMERA - BACK CAMERA
// ============================================================

const html5QrCode =
  new Html5Qrcode("reader");

Html5Qrcode.getCameras()

.then(function(devices) {

  if (!devices || !devices.length) {

    document.getElementById("result").className = "wait";

    document.getElementById("result").innerHTML =
      "❌<br>No camera found.";

    return;
  }

  console.log("Available cameras:", devices);

  // Try to find the rear/back camera by its name
  let backCamera = devices.find(function(device) {

    const label =
      (device.label || "").toLowerCase();

    return (
      label.includes("back") ||
      label.includes("rear") ||
      label.includes("environment")
    );

  });

  // If the browser does not provide camera names,
  // use the environment-facing camera setting.
  if (backCamera) {

    console.log(
      "✅ Back camera selected:",
      backCamera.label
    );

    html5QrCode.start(

      backCamera.id,

      {
        fps: 10,
        qrbox: 250
      },

      onScanSuccess

    );

  } else {

    console.log(
      "⚠️ Back camera name not available."
    );

    console.log(
      "Using environment-facing camera."
    );

    html5QrCode.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      {
        fps: 10,
        qrbox: 250
      },

      onScanSuccess

    );

  }

})

.catch(function(error) {

  console.error(
    "Camera error:",
    error
  );

  document.getElementById("result").className =
    "wait";

  document.getElementById("result").innerHTML =
    "❌<br>Camera Error";

});

</script>


</body>

</html>

<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Petformance Attendance Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h2 {
  color: #1565c0;
  margin-bottom: 5px;
}

h3 {
  margin-top: 5px;
  color: #555;
}

#reader {
  width: 320px;
  margin: 20px auto;
}

#result {
  margin: 20px auto;
  max-width: 400px;
  padding: 20px;
  font-size: 20px;
  font-weight: bold;
  background: white;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.name {
  font-size: 24px;
  margin-bottom: 10px;
}

.success {
  color: #188038;
}

.wait {
  color: #d93025;
}

.ready {
  color: #1565c0;
}

</style>

</head>

<body>

<h2>Petformance Veterinary</h2>

<h3>Attendance Scanner</h3>

<div id="reader"></div>

<div id="result" class="ready">
  Ready to scan
</div>


<script>

let scanLock = false;


/* =========================
   QR SCAN
========================= */

function onScanSuccess(decodedText) {

  if (scanLock) {
    return;
  }

  scanLock = true;

  document.getElementById("result").className = "ready";

  document.getElementById("result").innerHTML =
    "Reading QR...";


  let employeeCode = "";


  /* =========================
     GET EMPLOYEE CODE
  ========================= */

  try {

    const qrUrl = new URL(decodedText);

    employeeCode =
      qrUrl.searchParams.get("code");

  } catch (error) {

    employeeCode =
      decodedText.trim();

  }


  if (!employeeCode) {

    document.getElementById("result").className = "wait";

    document.getElementById("result").innerHTML =
      "❌<br>No employee code found";

    unlockScanner(5000);

    return;
  }


  /* =========================
     SEND TO APPS SCRIPT
  ========================= */

  document.getElementById("result").innerHTML =
    "Checking employee...";


  const appsScriptUrl =
    "https://script.google.com/macros/s/AKfycbxk-aX6MmYty1x19roVee3vRf5v7YQWdpSH4CJjI7dtZ5_UMpcrMW5HuhEtJhSqe8gx/exec";


  fetch(
    appsScriptUrl +
    "?attendance=1&code=" +
    encodeURIComponent(employeeCode)
  )

  .then(response => response.text())

  .then(result => {

    showResult(result);

  })

  .catch(error => {

    document.getElementById("result").className = "wait";

    document.getElementById("result").innerHTML =
      "❌<br>Connection error";

    unlockScanner(5000);

  });

}


/* =========================
   DISPLAY RESULT
========================= */

  
function showResult(result) {

  let message = result.trim();
  let data;

  try {
    data = JSON.parse(message);
  }

  catch (error) {

    if (message.startsWith("Please wait")) {

      document.getElementById("result").className = "wait";

      document.getElementById("result").innerHTML =
        "⏳<br>" + message;

      unlockScanner(3000);

      return;
    }

    if (message === "Attendance already completed") {

      document.getElementById("result").className = "wait";

      document.getElementById("result").innerHTML =
        "ℹ️<br>Attendance already completed";

      unlockScanner(5000);

      return;
    }

    document.getElementById("result").className = "wait";

    document.getElementById("result").innerHTML =
      message;

    unlockScanner(5000);

    return;
  }


  if (data.type === "TIME_IN") {

    document.getElementById("result").className =
      "success";

    document.getElementById("result").innerHTML =

      "✅<br>" +

      "<div class='name'>TIME IN</div>" +

      "<strong>" +
      data.name +
      "</strong><br>" +

      data.employeeID +
      "<br>" +

      data.position +
      "<br><br>" +

      "<strong>" +
      data.time +
      "</strong><br><br>" +

      data.message;

    unlockScanner(8000);

    return;
  }


  if (data.type === "TIME_OUT") {

    document.getElementById("result").className =
      "success";

    document.getElementById("result").innerHTML =

      "✅<br>" +

      "<div class='name'>TIME OUT</div>" +

      "<strong>" +
      data.name +
      "</strong><br>" +

      data.employeeID +
      "<br>" +

      data.position +
      "<br><br>" +

      "<strong>" +
      data.time +
      "</strong><br>" +

      "Total Hours: " +
      data.totalHours +
      "<br><br>" +

      data.message;

    unlockScanner(8000);

    return;
  }


  document.getElementById("result").className =
    "wait";

  document.getElementById("result").innerHTML =
    message;

  unlockScanner(5000);

}

/* =========================
   SCANNER UNLOCK
========================= */

function unlockScanner(delay) {

  setTimeout(function() {

    scanLock = false;

    document.getElementById("result").className =
      "ready";

    document.getElementById("result").innerHTML =
      "Ready for next scan";

  }, delay);

}


/* =========================
   START CAMERA
========================= */

const html5QrCode =
  new Html5Qrcode("reader");


Html5Qrcode.getCameras()

.then(function(devices) {

  if (devices && devices.length) {

    html5QrCode.start(

      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: 250
      },

      onScanSuccess

    );

  } else {

    document.getElementById("result").innerHTML =
      "No camera found.";

  }

})

.catch(function(error) {

  document.getElementById("result").className =
    "wait";

  document.getElementById("result").innerHTML =
    "Camera Error";

});

</script>

</body>
</html>
